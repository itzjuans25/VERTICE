services:
  - type: web
    name: techstore-web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci --include=dev && npm run build
    staticPublishPath: ./build
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: REACT_APP_AUTH_URL
        sync: false
      - key: REACT_APP_CATALOGO_URL
        sync: false
      - key: REACT_APP_REQUEST_TIMEOUT_MS
        value: "15000"
  - type: web
    name: techstore-auth
    runtime: docker
    region: oregon
    plan: free
    rootDir: auth/auth/auth
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: "10000"
      - key: JAVA_TOOL_OPTIONS
        value: "-XX:ActiveProcessorCount=2"
      - fromGroup: techstore-config
      - key: SPRING_RABBITMQ_ADDRESSES
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: DB_HOST
        fromDatabase:
          name: techstore-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: techstore-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: techstore-db
          property: database
      - key: DB_USERNAME
        fromDatabase:
          name: techstore-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: techstore-db
          property: password
  - type: web
    name: techstore-catalogo
    runtime: docker
    region: oregon
    plan: free
    rootDir: catalogo/catalogo
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: "10000"
      - key: JAVA_TOOL_OPTIONS
        value: "-XX:ActiveProcessorCount=2"
      - fromGroup: techstore-config
      - key: SPRING_RABBITMQ_ADDRESSES
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: DB_HOST
        fromDatabase:
          name: techstore-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: techstore-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: techstore-db
          property: database
      - key: DB_USERNAME
        fromDatabase:
          name: techstore-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: techstore-db
          property: password
      - key: AUTH_SERVICE_URL
        sync: false
  - type: web
    name: techstore-notificaciones
    runtime: docker
    region: oregon
    plan: free
    rootDir: notificaciones
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: "10000"
      - key: JAVA_TOOL_OPTIONS
        value: "-XX:ActiveProcessorCount=2"
      - fromGroup: techstore-config
      - key: SPRING_RABBITMQ_ADDRESSES
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: DB_HOST
        fromDatabase:
          name: techstore-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: techstore-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: techstore-db
          property: database
      - key: DB_USERNAME
        fromDatabase:
          name: techstore-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: techstore-db
          property: password
      - key: MAIL_HOST
        value: smtp-relay.brevo.com
      - key: MAIL_PORT
        value: "2525"
      - key: MAIL_SMTP_AUTH
        value: "true"
      - key: MAIL_STARTTLS
        value: "true"
      - key: MAIL_USERNAME
        sync: false
      - key: MAIL_PASSWORD
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: MAIL_FROM_NAME
        value: TechStore
      - key: SMS_PROVIDER
        value: log
      - key: NOTIFICACIONES_API_KEY
        generateValue: true
envVarGroups:
  - name: techstore-config
    envVars:
      - key: JWT_SECRET
        generateValue: true
databases:
  - name: techstore-db
    databaseName: ecommerce
    region: oregon
    plan: free
    ipAllowList: []
