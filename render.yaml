services:
  - type: web
    name: techstore-auth
    runtime: docker
    region: oregon
    plan: free
    rootDir: auth
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - fromGroup: techstore-config
      - key: DB_HOST
        sync: false
      - key: DB_NAME
        sync: false
      - key: DB_URL
        value: jdbc:postgresql://${DB_HOST}:5432/${DB_NAME}?sslmode=require&connectTimeout=5
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: SPRING_RABBITMQ_ADDRESSES
        sync: false
      - key: SPRING_RABBITMQ_SSL_ENABLED
        value: "true"
      - key: CORS_ALLOWED_ORIGINS
        sync: false
  - type: web
    name: techstore-catalogo
    runtime: docker
    region: oregon
    plan: free
    rootDir: catalogo
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - fromGroup: techstore-config
      - key: DB_HOST
        sync: false
      - key: DB_NAME
        sync: false
      - key: DB_URL
        value: jdbc:postgresql://${DB_HOST}:5432/${DB_NAME}?sslmode=require&connectTimeout=5
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: SPRING_RABBITMQ_ADDRESSES
        sync: false
      - key: SPRING_RABBITMQ_SSL_ENABLED
        value: "true"
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: AUTH_SERVICE_URL
        sync: false
  - type: web
    name: techstore-notificaciones
    runtime: docker
    region: oregon
    plan: free
    rootDir: notificaciones
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - fromGroup: techstore-config
      - key: DB_HOST
        sync: false
      - key: DB_NAME
        sync: false
      - key: DB_URL
        value: jdbc:postgresql://${DB_HOST}:5432/${DB_NAME}?sslmode=require&connectTimeout=5
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: SPRING_RABBITMQ_ADDRESSES
        sync: false
      - key: SPRING_RABBITMQ_SSL_ENABLED
        value: "true"
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: MAIL_HOST
        value: smtp-relay.brevo.com
      - key: MAIL_PORT
        value: "2525"
      - key: MAIL_SMTP_AUTH
        value: "true"
      - key: MAIL_STARTTLS
        value: "true"
      - key: MAIL_USERNAME
        sync: false
      - key: MAIL_PASSWORD
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: MAIL_FROM_NAME
        value: TechStore
      - key: SMS_PROVIDER
        value: log
      - key: NOTIFICACIONES_API_KEY
        generateValue: true
  - type: web
    name: techstore-subastas
    runtime: docker
    region: oregon
    plan: free
    rootDir: subastas
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - fromGroup: techstore-config
      - key: DB_HOST
        sync: false
      - key: DB_NAME
        sync: false
      - key: DB_URL
        value: jdbc:postgresql://${DB_HOST}:5432/${DB_NAME}?sslmode=require&connectTimeout=5
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: SPRING_RABBITMQ_ADDRESSES
        sync: false
      - key: SPRING_RABBITMQ_SSL_ENABLED
        value: "true"
      - key: CORS_ALLOWED_ORIGINS
        sync: false
envVarGroups:
  - name: techstore-config
    envVars:
      - key: JWT_SECRET
        generateValue: true
      - key: JAVA_TOOL_OPTIONS
        value: "-XX:ActiveProcessorCount=2"
      - key: SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE
        value: "4"
      - key: SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE
        value: "0"
      - key: SPRING_DATASOURCE_HIKARI_CONNECTION_TIMEOUT
        value: "30000"
      - key: SPRING_DATASOURCE_HIKARI_MAX_LIFETIME
        value: "240000"
