spring.application.name=auth
server.port=${PORT:${SERVER_PORT:9090}}

# Base de datos (PostgreSQL)
spring.datasource.url=${DB_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:ecommerce}}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.hikari.initialization-fail-timeout=60000
spring.datasource.hikari.data-source-properties.connectTimeout=5
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# RabbitMQ (reemplazo de AWS SQS)
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}

# JWT
# En produccion define JWT_SECRET con al menos 32 caracteres aleatorios.
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:1440}

# CORS
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

# Mensajeria de notificaciones (reemplazo de AWS SQS)
app.notificaciones.exchange=${NOTIFICACIONES_EXCHANGE:notificaciones.exchange}

# Actuator (healthcheck de Docker)
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.readiness.include=readinessState,db
management.endpoint.health.group.readiness.additional-path=server:/health
springdoc.paths-to-match=/api/ecommerce/**
