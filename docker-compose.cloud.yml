services:
  postgres:
    ports: !reset []
  rabbitmq:
    ports: !reset []
  mailpit:
    ports: !reset []
  auth:
    ports: !reset []
    environment:
      CORS_ALLOWED_ORIGINS: https://${PUBLIC_DOMAIN:?Configura PUBLIC_DOMAIN}
  catalogo:
    ports: !reset []
    environment:
      CORS_ALLOWED_ORIGINS: https://${PUBLIC_DOMAIN:?Configura PUBLIC_DOMAIN}
  notificaciones:
    ports: !reset []
    environment:
      MAIL_HOST: ${MAIL_HOST:?Configura el host SMTP de produccion}
      MAIL_USERNAME: ${MAIL_USERNAME:?Configura el usuario SMTP}
      MAIL_PASSWORD: ${MAIL_PASSWORD:?Configura la clave SMTP}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_SMTP_AUTH: "true"
      MAIL_STARTTLS: "true"
  frontend:
    ports: !reset []
    build:
      args:
        REACT_APP_AUTH_URL: /auth
        REACT_APP_CATALOGO_URL: /catalogo
  proxy:
    image: caddy:2-alpine
    environment:
      PUBLIC_DOMAIN: ${PUBLIC_DOMAIN:?Configura PUBLIC_DOMAIN}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./scripts/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on:
      frontend:
        condition: service_healthy
    restart: unless-stopped
volumes:
  caddy_data:
